name: Java CI Pipeline

# Déclencheurs : s'exécute à chaque push ou Pull Request sur la branche main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    # Environnement d'exécution (Machine virtuelle Linux fournie par GitHub)
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Télécharger le code du dépôt sur la machine virtuelle
      - name: Checkout du code source
        uses: actions/checkout@v4

      # Étape 2 : Installer Java 17 et configurer le cache Maven
      - name: Configuration de Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Étape 3 : Compiler le code pour vérifier qu'il n'y a pas d'erreur de syntaxe
      - name: Compilation du code (Maven Compile)
        run: mvn compile

      # Étape 4 : Exécuter les tests unitaires JUnit
      - name: Exécution des tests unitaires (Maven Test)
        run: mvn test

      # Étape 5 : Générer le fichier .jar prêt pour la production
      - name: Packaging pour la production (Maven Package)
        run: mvn package -DskipTests